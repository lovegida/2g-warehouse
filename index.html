<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2G-倉儲管理系統</title>

    <!-- 載入失敗時把錯誤顯示在畫面上（正常時不會出現） -->
    <script>
    (function () {
        var errs = [];
        addEventListener('error', function (e) {
            errs.push(e.message || ('無法載入：' + ((e.target && (e.target.src || e.target.href)) || '未知資源')));
        }, true);
        addEventListener('securitypolicyviolation', function (e) {
            errs.push('安全政策擋下 ' + e.violatedDirective + (e.blockedURI ? '（' + e.blockedURI + '）' : '') + '\n完整政策：' + e.originalPolicy);
        });
        addEventListener('load', function () {
            setTimeout(function () {
                var app = document.getElementById('app');
                if (app && app.children.length) return;
                var box = document.createElement('pre');
                box.style.cssText = 'white-space:pre-wrap;word-break:break-all;margin:16px;padding:16px;border:3px solid #3E3A39;border-radius:16px;background:#fff;color:#b91c1c;font:14px/1.6 sans-serif';
                box.textContent = '頁面沒有正常載入，請把這段訊息截圖回報：\n\n' + (errs.length ? errs.join('\n\n') : '沒有收到錯誤訊息');
                document.body.appendChild(box);
            }, 1500);
        });
    })();
    </script>

    <!-- 引入 Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.45/dist/vue.global.prod.js"></script>

    <!-- 引入 SheetJS (用於匯出 Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <!-- Tailwind 自定義設定 (符合繪本風格) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FFFCF6',
                        ink: '#3E3A39',
                        pink: '#F2A497',
                        yellow: '#F6D27A',
                        blue: '#A8D3E6',
                        green: '#B9DAA5',
                        grayLight: '#E5E7EB',
                        grayDark: '#9CA3AF'
                    },
                    borderWidth: {
                        '3': '3px',
                    },
                    boxShadow: {
                        'cute': '4px 4px 0px #3E3A39',
                        'cute-sm': '2px 2px 0px #3E3A39',
                        'cute-inner': 'inset 2px 2px 0px #3E3A39',
                    },
                    fontFamily: {
                        'sans': ['jf-openhuninn-1.1', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFFCF6;
            color: #3E3A39;
            /* 隱藏原生滾動條，保持畫面乾淨 */
            scrollbar-width: thin;
            scrollbar-color: #F6D27A #FFFCF6;
        }

        /* 自定義按鈕動畫 */
        .btn-cute {
            transition: all 0.1s ease;
        }
        .btn-cute:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #3E3A39;
        }

        /* 隱藏 input number 的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* 讀取中的徽章：圖片上疊一行網站字型的 Loading 文字（字跟著網站字型走） */
        .loading-badge {
            position: relative;
            width: clamp(170px, 46vw, 210px);
            aspect-ratio: 1 / 1;
            container-type: inline-size;
        }
        .loading-badge img {
            display: block;
            width: 100%;
            height: 100%;
            border: 3px solid #3E3A39;
            border-radius: 24px;
            box-shadow: 4px 4px 0 #3E3A39;
        }
        .loading-badge span {
            position: absolute;
            left: 0;
            right: 0;
            top: 48.4%; /* 跟左右兩個 Lv1 的中線對齊 */
            transform: translateY(-50%);
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            font-weight: 900;
            color: #A9533F;
            font-size: 10px;
            font-size: 5.1cqw;
            animation: loading-pulse 1.4s ease-in-out infinite;
        }
        @keyframes loading-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        /* 很快就完成的動作不要閃一下：0.15 秒後才淡入 */
        .loading-overlay {
            animation: loading-fade-in 0.2s ease 0.15s both;
        }
        @keyframes loading-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 周邊沒有設定位置時，不顯示右上角的位置標籤 */
        .loc-badge:empty {
            display: none;
        }

        /* 彈窗背景模糊 */
        .modal-backdrop {
            background-color: rgba(62, 58, 57, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen pb-20">

<div id="app"></div>
<div id="admin"></div>
<div id="gate"></div>

function requirePasscode() {
    const hadCode = !!gate.passcode;
    gate.passcode = '';
    writeLocal(PASSCODE_KEY, '');
    gate.required = true;
    gate.error = hadCode ? '通行碼不正確，可能已經更換了，請向管理者確認。' : '';
}

async function submitGate() {
    const code = gate.input.trim();
    if (!code) { gate.error = '請輸入通行碼'; return; }
    gate.busy = true;
    gate.error = '';
    gate.passcode = code;
    try {
        const payload = await callApi('getState');
        applyState(payload.state);
        writeLocal(PASSCODE_KEY, code);
        gate.required = false;
        gate.input = '';
    } catch (e) {
        gate.error = e.needPasscode ? '通行碼不正確，請再試一次。' : e.message;
    } finally {
        gate.busy = false;
    }
}

function lockAdmin() {
    admin.password = '';
    writeSession('adminPassword', '');
}

// 把試算表回傳的資料套用到畫面上。周邊沿用同一個物件，購物車和彈窗裡的周邊才會跟著更新庫存
function applyState(state) {
    const existing = new Map(allItems.value.map(item => [item.id, item]));
    allItems.value = state.items.map(raw => {
        const item = existing.get(raw.id);
        return item ? Object.assign(item, raw) : raw;
    });

    // 試算表裡每個周邊一列，畫面上同一筆異動合併成一列
    const grouped = new Map();
    state.logs.forEach(row => {
        if (!grouped.has(row.logId)) {
            grouped.set(row.logId, {
                id: row.logId, date: row.date, orderNumber: row.orderNumber, action: row.action,
                person: row.person, location: row.location, details: row.details, items: []
            });
        }
        grouped.get(row.logId).items.push({ name: row.itemName, qtyChange: row.qtyChange, remainingStock: row.remainingStock });
    });
    // 新的在前；系統啟用前補登的紀錄也會依日期排到正確的位置
    logs.value = [...grouped.values()].reverse().sort((a, b) => b.date.localeCompare(a.date));
    quotas.value = state.quotas || [];
    wishesOld.value = [...state.wishesOld].reverse();
    wishesNew.value = [...state.wishesNew].reverse();
    feedbacks.value = [...(state.feedbacks || [])].reverse();
    notices.value = state.notices || [];

    const d = new Date();
    sync.adminConfigured = state.adminConfigured;
    sync.status = 'ready';
    sync.error = '';
    sync.lastSync = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// 放在 GitHub 時，網頁用這個網址讀寫試算表（Apps Script 部署的網頁應用程式網址）
const API_URL = 'https://script.google.com/macros/s/AKfycbxvy37Rvs-ZS1rHtZHAA0bvDTNJ9VTdjeKpKrsdWWV7r8wUDzeYdwi19WwFTvckduen/exec';

// 在 Apps Script 裡打開時用 google.script.run；其他地方（GitHub）用 fetch 呼叫 Code.gs 的 doPost
function sendToSheet(fnName, args) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](...args);
        });
    }
    // text/plain 不會觸發跨網域預檢；credentials: 'omit' 不帶 Google 登入狀態，登入多個帳號也不會出錯
    return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fnName, args }),
        credentials: 'omit',
        redirect: 'follow',
    }).then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
    });
}

// 呼叫 Code.gs 裡的 getState / runAction，回傳的是 JSON 字串
async function callApi(fnName, ...args) {
    // 每次呼叫都帶上夥伴通行碼
    if (fnName === 'getState') args = [gate.passcode];
    if (fnName === 'runAction') args = [JSON.stringify(Object.assign(JSON.parse(args[0]), { passcode: gate.passcode }))];
    let payload;
    const showBusy = fnName === 'runAction'; // 背景自動更新（getState）不顯示
    if (showBusy) busy.count++;
    try {
        const text = await sendToSheet(fnName, args);
        payload = JSON.parse(text);
    } catch (e) {
        throw new Error('連不上試算表，請確認網路後重新整理頁面（' + ((e && e.message) || e) + '）');
    } finally {
        if (showBusy) busy.count--;
    }
    if (!payload.ok) {
        if (payload.needPasscode) requirePasscode();
        const err = new Error(payload.error || '試算表回傳錯誤');
        err.state = payload.state;
        err.needPasscode = !!payload.needPasscode;
        throw err;
    }
    return payload;
}

// 寫入進行中或剛寫完時，比較早送出的讀取結果已經過時，不能拿來蓋掉畫面
let writeEpoch = 0;

async function refresh() {
    if (sync.saving || gate.required) return; // 等夥伴輸入通行碼後再讀
    const epoch = writeEpoch;
    try {
        const payload = await callApi('getState');
        if (epoch === writeEpoch && !sync.saving) applyState(payload.state);
    } catch (e) {
        if (e.needPasscode) return;
        sync.status = 'error';
        sync.error = e.message;
    }
}

async function save(action, data, { asAdmin = false } = {}) {
    if (asAdmin && !admin.password) throw new Error('這個動作需要管理者權限：請先點左下角「🔧 管理」輸入密碼');
    const body = { action, data };
    if (asAdmin) body.adminPassword = admin.password;
    sync.saving = true;
    writeEpoch++;
    try {
        const payload = await callApi('runAction', JSON.stringify(body));
        applyState(payload.state);
        return payload.result;
    } catch (e) {
        if (e.state) applyState(e.state);
        if (e.message === '管理者密碼不正確') lockAdmin();
        throw e;
    } finally {
        sync.saving = false;
        writeEpoch++;
    }
}

// 上傳前先把圖片縮到最長邊 1200px，避免檔案太大
function readImageForUpload(file, maxSize = 1200) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            const keepPng = file.type === 'image/png';
            if (!keepPng) {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            const mimeType = keepPng ? 'image/png' : 'image/jpeg';
            resolve({ mimeType, base64: canvas.toDataURL(mimeType, 0.85).split(',')[1] });
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('讀不到這張圖片，請換一張 JPG 或 PNG'));
        };
        img.src = url;
    });
}

// 同一個位置的列依序整理成：段落、置中、列點（條列＋底下的小條列）、日期卡片（周邊相關記事）
function noticeBlocks(place) {
    const blocks = [];
    let card = null;
    notices.value.filter(n => n.place === place).forEach(n => {
        const style = n.style || '段落';
        if (style === '日期') {
            card = { type: 'date', text: n.text, blocks: [] };
            blocks.push(card);
            return;
        }
        const target = card ? card.blocks : blocks;
        if (style === '條列' || style === '小條列') {
            let list = target[target.length - 1];
            if (!list || list.type !== 'list') { list = { type: 'list', items: [] }; target.push(list); }
            if (style === '小條列' && list.items.length) list.items[list.items.length - 1].sub.push(n.text);
            else list.items.push({ text: n.text, sub: [] });
            return;
        }
        target.push({ type: style === '置中' ? 'center' : 'p', text: n.text });
    });
    return blocks;
}

const TAB_KEYS = TABS.map(t => t.key);
const tabFromHash = () => {
    const key = decodeURIComponent(location.hash.slice(1));
    return TAB_KEYS.includes(key) ? key : 'current';
};
activeTab.value = tabFromHash();
window.addEventListener('hashchange', () => { activeTab.value = tabFromHash(); });

// 一般點擊才收起選單；按著 ⌘／Ctrl／Shift 點是開新分頁，原本的頁面不動
const isPlainClick = e => !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey);

const MobileNav = markRaw({
    setup() {
        const open = ref(false);
        const choose = e => {
            if (!isPlainClick(e)) return;
            open.value = false;
            window.scrollTo(0, 0);
        };
        onMounted(() => document.addEventListener('keydown', e => { if (e.key === 'Escape') open.value = false; }));

        const tabCls = 'px-4 py-2 rounded-2xl border-3 border-ink font-bold text-lg';
        return () => {
            const current = TABS.find(t => t.key === activeTab.value) || TABS[0];
            return h('div', { class: 'lg:hidden relative' }, [
                open.value ? h('div', { class: 'fixed inset-0 bg-ink/30', onClick: () => { open.value = false; } }) : null,
                h('div', { class: 'relative flex items-center justify-between gap-3 px-4 py-3 bg-paper' }, [
                    h('span', { class: tabCls + ' shadow-cute truncate ' + current.color }, current.label),
                    h('button', {
                        type: 'button',
                        'aria-label': open.value ? '關閉選單' : '打開選單',
                        'aria-expanded': String(open.value),
                        class: 'w-12 h-12 shrink-0 rounded-2xl border-3 border-ink bg-white shadow-cute-sm btn-cute flex flex-col items-center justify-center gap-[5px]',
                        onClick: () => { open.value = !open.value; }
                    }, open.value
                        ? h('span', { class: 'text-2xl font-bold leading-none' }, '✕')
                        : [0, 1, 2].map(() => h('span', { class: 'block w-6 h-[3px] rounded-full bg-ink' })))
                ]),
                open.value
                    ? h('div', { class: 'absolute left-0 right-0 top-full bg-paper border-b-3 border-ink shadow-sm px-4 pt-3 pb-4 space-y-3' },
                        TABS.map(t => h('a', {

                    : null
            ]);
        };
    }
});

async function toggleLike(wish) {
    if (busy.count > 0) return;
    const liked = likedWishes.has(wish.key);
    try {
        await save('likeWish', { key: wish.key, delta: liked ? -1 : 1 });
        if (liked) likedWishes.delete(wish.key);
        else likedWishes.add(wish.key);
        writeLocal(LIKED_KEY, JSON.stringify([...likedWishes]));
    } catch (e) {
        alert(e.message);
    }
}

/* ───────── 依申請配額領取（例如桌曆），顯示在「目前上架周邊」最上面 ───────── */

const QuotaSection = markRaw({
    setup() {
        const quotaItems = computed(() => allItems.value.filter(item => item.category === '配額'));
        const quotasOf = item => quotas.value.filter(q => q.itemId === item.id);
        const sum = (list, key) => list.reduce((n, q) => n + q[key], 0);

        // 領取或歸還的彈窗
        const form = reactive({ open: false, mode: 'claim', item: null, quotaId: '', person: '', qty: '', reason: '', useDate: '', error: '', orderNumber: '' });
        const selectedQuota = () => quotas.value.find(q => q.id === form.quotaId);

        const openForm = (item, mode) => {
            const d = new Date();
            const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            Object.assign(form, { open: true, mode, item, quotaId: '', person: '', qty: '', reason: '', useDate: today, error: '', orderNumber: '' });
        };
        const closeForm = () => { form.open = false; };

        // 選了配額後，負責夥伴只有一位就直接帶入
        const pickQuota = id => {
            form.quotaId = id;
            const q = selectedQuota();
            form.person = q && q.partners.length === 1 ? q.partners[0] : '';
        };

        const submit = async () => {
            if (sync.saving) return;
            const q = selectedQuota();
            const claim = form.mode === 'claim';
            form.error = '';
            if (!q || !form.person || !form.qty || !form.reason || (claim && !form.useDate)) { form.error = '請填寫所有必填欄位！'; return; }
            const qty = Number(form.qty);
            if (!Number.isInteger(qty) || qty <= 0) { form.error = '數量必須是大於 0 的整數！'; return; }
            if (claim && qty > q.remaining) { form.error = `這筆配額只剩 ${q.remaining}，請調整數量`; return; }
            if (claim && qty > form.item.stock) { form.error = `「${form.item.name}」庫存只剩 ${form.item.stock} 個，請調整數量`; return; }
            if (!claim && qty > q.claimed) { form.error = `這筆配額目前只領了 ${q.claimed}，歸還數量不能比這個多`; return; }
            try {
                const result = await save(claim ? 'claimQuota' : 'returnQuota', {
                    quotaId: q.id, person: form.person, qty, reason: form.reason, useDate: form.useDate
                });
                if (claim) form.orderNumber = result.orderNumber;
                else closeForm();
            } catch (e) {
                form.error = e.message;
            }
        };

        const quotaTable = item => {
            const list = quotasOf(item);
            if (!list.length) {
                return h('div', { class: 'flex items-center justify-center text-center text-gray-500 font-bold p-8 border-2 border-dashed border-ink/30 rounded-2xl' },
                    '還沒有配額：請到試算表的「配額」工作表新增');
            }
            const th = (text, cls = '') => h('th', { class: 'p-2 font-bold border-b-2 border-ink whitespace-nowrap ' + cls }, text);
            const td = (text, cls = '') => h('td', { class: 'p-2 ' + cls }, text);
            const remainingTotal = sum(list, 'remaining');
            return h('div', null, [
                h('div', { class: 'overflow-x-auto border-2 border-ink rounded-2xl' }, [
                    h('table', { class: 'w-full text-left border-collapse text-sm min-w-[560px]' }, [
                        h('thead', null, [h('tr', { class: 'bg-blue/40' }, [
                            th('負責縣市'), th('負責夥伴'), th('用途'), th('預計', 'text-right'), th('已領', 'text-right'), th('剩餘', 'text-right')
                        ])]),
                        h('tbody', null, [
                            ...list.map(q => h('tr', { key: q.id, class: 'border-b border-ink/20' }, [
                                td(q.county, 'font-bold whitespace-nowrap'),
                                td(q.partnerText, 'font-bold whitespace-nowrap'),
                                td(q.purpose, 'text-gray-600'),
                                td(q.planned, 'text-right'),
                                td(q.claimed, 'text-right'),
                                td(q.remaining, 'text-right font-black ' + (q.remaining > 0 ? 'text-ink' : 'text-gray-400'))
                            ])),
                            h('tr', { class: 'bg-yellow/30' }, [
                                td('合計', 'font-bold'), td(''), td(''),
                                td(sum(list, 'planned'), 'text-right font-bold'),
                                td(sum(list, 'claimed'), 'text-right font-bold'),
                                td(remainingTotal, 'text-right font-black')
                            ])
                        ])
                    ])
                ]),
                remainingTotal > item.stock
                    ? h('p', { class: 'text-sm font-bold text-red-500 mt-2' }, `⚠️ 配額還有 ${remainingTotal} 沒領，但庫存只剩 ${item.stock}，數量對不起來，請確認。`)
                    : null
            ]);
        };

        const quotaCard = item => h('div', { key: item.id, class: 'bg-white border-3 border-ink rounded-3xl p-4 sm:p-6 shadow-cute mb-6' }, [
            h('div', { class: 'grid grid-cols-1 md:grid-cols-[220px_1fr] gap-6' }, [
                h('div', { class: 'flex flex-col' }, [
                    h('div', { class: 'aspect-square bg-blue/20 border-2 border-ink rounded-2xl mb-4 overflow-hidden flex items-center justify-center' }, [
                        item.image
                            ? h('img', { src: item.image, alt: item.name, class: 'w-full h-full object-contain' })
                            : h('span', { class: 'text-6xl' }, '📅')
                    ]),
                    h('h3', { class: 'text-xl font-bold mb-1' }, item.name),
                    h('div', { class: 'text-gray-600 mb-1 font-bold flex justify-between' }, [
                        h('span', null, ['庫存: ', h('span', { class: item.stock <= 10 ? 'text-red-500 text-xl' : 'text-ink text-xl' }, item.stock)]),
                        h('span', { class: 'text-sm self-end' }, '成本: $' + item.cost)
                    ]),
                    item.location ? h('div', { class: 'text-sm font-bold text-gray-500' }, '📍 ' + item.location) : null,
                    h('div', { class: 'mt-4 grid grid-cols-2 gap-2' }, [
                        h('button', { class: 'bg-blue border-2 border-ink rounded-xl py-2 font-bold btn-cute', onClick: () => openForm(item, 'claim') }, '依配額領取'),
                        h('button', { class: 'bg-pink border-2 border-ink rounded-xl py-2 font-bold btn-cute', onClick: () => openForm(item, 'return') }, '歸還')
                    ])
                ]),
                quotaTable(item)
            ])
        ]);

        const successView = () => h('div', { class: 'bg-paper border-3 border-ink rounded-3xl p-8 shadow-cute w-full max-w-sm relative text-center' }, [
            h('div', { class: 'text-5xl mb-4' }, '🎉'),
            h('h3', { class: 'text-2xl font-bold mb-2' }, '領取成功！'),
            h('p', { class: 'font-bold text-gray-600 mb-4' }, '您的專屬號碼牌為：'),
            h('div', { class: 'bg-blue border-3 border-ink rounded-2xl py-4 px-6 text-2xl font-black text-ink mb-6 shadow-cute-inner' }, form.orderNumber),
            h('button', { class: 'w-full bg-ink text-white border-2 border-ink rounded-xl py-3 font-bold hover:bg-gray-800 btn-cute text-lg', onClick: closeForm }, '好的，我知道了！')
        ]);

        const formView = () => {
            const claim = form.mode === 'claim';
            const q = selectedQuota();
            const bind = key => ({ value: form[key], onInput: e => { form[key] = e.target.value; } });
            return h('div', { class: 'bg-paper border-3 border-ink rounded-3xl p-6 shadow-cute w-full max-w-lg relative max-h-[90vh] overflow-y-auto' }, [
                h('button', { class: closeBtnCls, onClick: closeForm }, 'X'),
                h('h3', { class: ['text-2xl font-bold mb-2 inline-block px-3 py-1 border-2 border-ink rounded-xl', claim ? 'bg-blue' : 'bg-pink'] },
                    claim ? '依配額領取' : '配額歸還'),
                h('h4', { class: 'text-xl font-bold mb-2 mt-2' }, form.item.name),
                h('div', { class: 'text-sm font-bold text-gray-500 mb-4 bg-white inline-block px-2 py-1 rounded border border-ink' }, '當前庫存: ' + form.item.stock),
                h('div', { class: 'space-y-4' }, [
                    field('選擇配額 *', h('select', { class: inputCls, value: form.quotaId, onChange: e => pickQuota(e.target.value) }, [
                        h('option', { value: '' }, '請選擇（縣市｜夥伴｜用途）'),
                        ...quotasOf(form.item).map(x => h('option', { value: x.id, disabled: claim ? x.remaining <= 0 : x.claimed <= 0 },
                            `${x.county}｜${x.partnerText}｜${x.purpose}（${claim ? '剩 ' + x.remaining : '已領 ' + x.claimed}）`))
                    ])),
                    field(claim ? '申請人 *' : '歸還人 *', h('select', {
                        class: inputCls, value: form.person, disabled: !q, onChange: e => { form.person = e.target.value; }
                    }, [
                        h('option', { value: '' }, q ? '請選擇' : '請先選擇配額'),
                        ...(q ? q.partners.map(p => h('option', { value: p }, p)) : [])
                    ])),
                    field(claim ? '領取數量 *' : '歸還數量 *', h('input', { type: 'number', min: 1, class: inputCls, ...bind('qty') })),
                    field(claim ? '領取原因 *' : '歸還原因 *', h('input', { class: inputCls, placeholder: claim ? '例如：教師研習後抽獎活動' : '例如：活動取消', ...bind('reason') })),
                    claim ? field('領用日期 *', h('input', { type: 'date', class: inputCls, ...bind('useDate') })) : null,
                    h('p', { class: 'text-xs font-bold text-gray-500' }, '只有配額名單上的夥伴可以領取；名單上沒有你的話，請先跟管理者確認。'),
                    form.error ? h('div', { class: errorCls + ' text-center' }, form.error) : null
                ]),
                h('button', { class: submitBtnCls, onClick: submit }, sync.saving ? '儲存中…' : claim ? '確認領取' : '確認歸還')
            ]);
        };

        return () => {
            if (!quotaItems.value.length) return null;
            return h('div', { class: 'mb-12' }, [
                h('h2', { class: 'text-3xl font-bold mb-2 flex items-center gap-3' }, [
                    h('span', { class: 'bg-blue w-4 h-8 rounded-full border-2 border-ink inline-block' }),
                    ` 依申請配額領取 (${quotaItems.value.length}) `
                ]),
                h('p', { class: 'font-bold text-gray-600 mb-6' }, '這區的周邊是依照夥伴登記的數量採購的：只有配額名單上的夥伴可以領取，每筆配額最多領到登記的數量。'),
                ...quotaItems.value.map(quotaCard),
                form.open && form.item
                    ? h(Teleport, { to: 'body' }, [
                        h('div', { class: 'fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop' }, [
                            form.orderNumber ? successView() : formView()
                        ])
                    ])
                    : null
            ]);
        };
    }
});

/* ───────── 主畫面 ───────── */

createApp({
    setup() {
        // 上架、加贈的周邊數量變 0 時，依試算表的「售完後」顯示在已下架周邊或絕版品；補貨後會自動回來
        const shownIn = item => (item.category === '上架' || item.category === '加贈') && item.stock <= 0
            ? (item.soldOut === '下架' ? '下架' : '絕版')
            : item.category;
        const byCategory = category => computed(() => allItems.value.filter(item => shownIn(item) === category));
        // 庫存低於 20 的排到最後，依數量由多到少（快沒了的在最下面）；其他照試算表的順序
        const LOW_STOCK = 20;
        const lowStockLast = category => computed(() => {
            const list = allItems.value.filter(item => shownIn(item) === category);
            return [
                ...list.filter(item => item.stock >= LOW_STOCK),
                ...list.filter(item => item.stock < LOW_STOCK).sort((a, b) => b.stock - a.stock)
            ];
        });
        const mainItems = lowStockLast('上架');
        const bonusItems = lowStockLast('加贈');
        const discontinuedItems = byCategory('下架');
        const obsoleteItems = byCategory('絕版');

        // 購物車系統
        const cart = ref([]);
        const tempCartQty = ref(1);

        const filter = ref({ startDate: '', endDate: '', keyword: '' });

        const modal = ref({ isOpen: false, type: '', error: '', orderNumber: '' });
        const activeItem = ref(null);
        const activeLog = ref(null); // 用於記錄彈窗選中的那筆異動明細

        const forms = ref({
            checkout: { person: '', location: '', purpose: '', useDate: '' },
            return: { person: '', itemName: '', qty: '', reason: '多領取周邊歸還' },
            restock: { person: '', itemName: '', qty: '' },
            wishOld: { person: '', qty: '' }
        });
        const formWishNew = ref({ person: '', itemName: '', fileName: '', notes: '' });
        const errorWishNew = ref('');
        let wishNewFile = null;

        const openModal = (type, item = null, log = null) => {
            modal.value = { isOpen: true, type, error: '', orderNumber: '' };
            if(item) activeItem.value = item;
            if(log) activeLog.value = log;

            if(type === 'addToCart') tempCartQty.value = 1;
            if(type === 'return') forms.value.return = { person: '', itemName: '', qty: '', reason: '多領取周邊歸還' };
            if(type === 'restock') {
                forms.value.restock = { person: '', itemName: '', qty: '' };
                if(!admin.password) modal.value.error = '補貨需要管理者權限：請先點左下角「🔧 管理」輸入密碼';
            }
            if(type === 'wishOld') forms.value.wishOld = { person: '', qty: '' };
        };

        const closeModal = () => {
            modal.value.isOpen = false;
            activeItem.value = null;
            activeLog.value = null;
        };

        const confirmAddToCart = () => {
            const qty = parseInt(tempCartQty.value);
            if(isNaN(qty) || qty <= 0) { modal.value.error = "數量必須大於 0！"; return; }
            if(qty > activeItem.value.stock) { modal.value.error = "無法超過當前庫存數！"; return; }

            const existing = cart.value.find(c => c.id === activeItem.value.id);
            if(existing) {
                if(existing.claimQty + qty > activeItem.value.stock) {
                    modal.value.error = "加上購物車內數量已超過總庫存！"; return;
                }
                existing.claimQty += qty;
            } else {
                cart.value.push({
                    id: activeItem.value.id,
                    name: activeItem.value.name,
                    claimQty: qty,
                    originalItem: activeItem.value
                });
            }
            closeModal();
        };

        const removeFromCart = (index) => {
            cart.value.splice(index, 1);
        };

        // 送出購物車：試算表會再檢查一次庫存，並產生號碼牌
        const submitCart = async () => {
            if(sync.saving) return;
            const f = forms.value.checkout;
            if(!f.person || !f.location || !f.purpose || !f.useDate) {
                modal.value.error = "請填寫所有必填資訊！";
                return;
            }

            for(let cItem of cart.value) {
                if(!Number.isInteger(cItem.claimQty) || cItem.claimQty <= 0 || cItem.claimQty > cItem.originalItem.stock) {
                    modal.value.error = `「${cItem.name}」的數量不正確或庫存不足，請調整！`;
                    return;
                }
            }

            modal.value.error = '';
            try {
                const result = await save('checkout', {
                    person: f.person, location: f.location, purpose: f.purpose, useDate: f.useDate,
                    items: cart.value.map(c => ({ id: c.id, qty: c.claimQty }))
                });
                cart.value = [];
                forms.value.checkout = { person: '', location: '', purpose: '', useDate: '' };
                modal.value = { isOpen: true, type: 'success', error: '', orderNumber: result.orderNumber };
            } catch (e) {
                modal.value.error = e.message;
            }
        };

        const submitReturn = async () => {
            if(sync.saving) return;
            const f = forms.value.return;
            const item = activeItem.value;
            if(!f.person || !f.itemName || !f.qty || !f.reason) { modal.value.error = "請填寫所有必填欄位！"; return; }
            if(f.itemName !== item.name) { modal.value.error = "周邊名稱不符！"; return; }
            const q = parseInt(f.qty);
            if(isNaN(q) || q <= 0) { modal.value.error = "數量錯誤！"; return; }

            modal.value.error = '';
            try {
                await save('returnItem', { person: f.person, itemId: item.id, qty: q, reason: f.reason });
                closeModal();
            } catch (e) {
                modal.value.error = e.message;
            }
        };

        const submitRestock = async () => {
            if(sync.saving) return;
            const f = forms.value.restock;
            const item = activeItem.value;
            if(!admin.password) { modal.value.error = '補貨需要管理者權限：請先點左下角「🔧 管理」輸入密碼'; return; }
            if(!f.person || !f.itemName || !f.qty) { modal.value.error = "請填寫所有必填欄位！"; return; }
            if(f.itemName !== item.name) { modal.value.error = "周邊名稱不符！"; return; }
            const q = parseInt(f.qty);
            if(isNaN(q) || q <= 0) { modal.value.error = "數量錯誤！"; return; }

            modal.value.error = '';
            try {
                await save('restock', { person: f.person, itemId: item.id, qty: q }, { asAdmin: true });
                closeModal();
            } catch (e) {
                modal.value.error = e.message;
            }
        };

        const submitWishOld = async () => {
            if(sync.saving) return;
            const f = forms.value.wishOld;
            if(!f.person || !f.qty) { modal.value.error = "請填寫所有必填欄位！"; return; }
            const q = parseInt(f.qty);
            if(isNaN(q) || q <= 0) { modal.value.error = "數量錯誤！"; return; }

            modal.value.error = '';
            try {
                await save('wishOld', { person: f.person, itemId: activeItem.value.id, qty: q });
                closeModal();
            } catch (e) {
                modal.value.error = e.message;
            }
        };

        const MAX_UPLOAD_MB = 20;
        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            e.target.value = ''; // 讓同一個檔案可以重新選
            if(!file) return;
            if(file.size > MAX_UPLOAD_MB * 1024 * 1024) {
                errorWishNew.value = `圖片太大了（上限 ${MAX_UPLOAD_MB}MB），請換一張，或先截圖再上傳`;
                return;
            }
            errorWishNew.value = '';
            wishNewFile = file;
            formWishNew.value.fileName = file.name;
        };

        const submitWishNew = async () => {
            if(sync.saving) return;
            const f = formWishNew.value;
            errorWishNew.value = '';
            if(!f.person || !f.itemName || !f.fileName || !wishNewFile) { errorWishNew.value = "請填寫所有欄位 (附圖必填)！"; return; }
            try {
                const imageUpload = await readImageForUpload(wishNewFile);
                await save('wishNew', { person: f.person, itemName: f.itemName, notes: f.notes, fileName: f.fileName, imageUpload });
                formWishNew.value = { person: '', itemName: '', fileName: '', notes: '' };
                wishNewFile = null;
            } catch (e) {
                errorWishNew.value = e.message;
            }
        };

        // 篩選邏輯，讓它可以搜到隱藏在 items 裡面的周邊名稱
        const filteredLogs = computed(() => {
            return logs.value.filter(log => {
                let matchDate = true, matchKeyword = true;
                if(filter.value.startDate) matchDate = matchDate && log.date.split(' ')[0] >= filter.value.startDate.replace(/-/g, '/');
                if(filter.value.endDate) {
                    const end = new Date(filter.value.endDate);
                    end.setDate(end.getDate() + 1);
                    const endStr = `${end.getFullYear()}/${String(end.getMonth()+1).padStart(2,'0')}/${String(end.getDate()).padStart(2,'0')}`;
                    matchDate = matchDate && log.date.split(' ')[0] < endStr;
                }
                if(filter.value.keyword) {
                    const kw = filter.value.keyword.toLowerCase();
                    const matchItemName = log.items.some(item => item.name.toLowerCase().includes(kw));
                    matchKeyword = matchItemName ||
                                   log.person.toLowerCase().includes(kw) ||
                                   (log.orderNumber && log.orderNumber.toLowerCase().includes(kw));
                }
                return matchDate && matchKeyword;
            });
        });

        const exportWishesOldToExcel = () => {
            if (wishesOld.value.length === 0) return;
            const data = wishesOld.value.map(w => ({ '許願時間': w.date, '許願人': w.person, '周邊名稱': w.itemName, '許願數量': w.qty }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "舊品許願清單");
            XLSX.writeFile(wb, `曾上架過周邊許願清單_${new Date().getTime()}.xlsx`);
        };

        const exportWishesNewToExcel = () => {
            if (wishesNew.value.length === 0) return;
            const data = wishesNew.value.map(w => ({ '許願時間': w.date, '許願人': w.person, '新周邊名稱': w.itemName, '認同人數': w.likes || 0, '參考圖片檔名': w.fileName, '參考圖片連結': w.imageUrl || '', '補充說明': w.notes || '' }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "新周邊許願清單");
            XLSX.writeFile(wb, `新周邊許願清單_${new Date().getTime()}.xlsx`);
        };

        // 匯出 Excel (攤平顯示，方便總務後續管理)
        const exportLogsToExcel = () => {
            if(filteredLogs.value.length === 0) return;
            const data = [];

            // 將合併後的紀錄「展開」成單行輸出
            filteredLogs.value.forEach(log => {
                log.items.forEach(item => {
                    data.push({
                        '日期時間': log.date,
                        '號碼牌/動作': log.orderNumber || `[${log.action}]`,
                        '周邊名稱': item.name,
                        '夥伴': log.person,
                        '縣市': log.location || '-',
                        '異動數量': item.qtyChange,
                        '剩餘庫存': item.remainingStock,
                        '備注說明': log.details
                    });
                });
            });

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "出入庫紀錄");
            XLSX.writeFile(wb, `出入庫紀錄_${new Date().getTime()}.xlsx`);
        };

        onMounted(() => {
            refresh();
            setInterval(() => { if(document.visibilityState === 'visible') refresh(); }, REFRESH_INTERVAL_MS);
            document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') refresh(); });
        });

        return {
            activeTab, mainItems, bonusItems, discontinuedItems, obsoleteItems,
            modal, activeItem, activeLog, forms, cart, tempCartQty,
            openModal, closeModal,
            confirmAddToCart, removeFromCart, submitCart,
            submitReturn, submitRestock, submitWishOld,
            wishesOld, wishesNew, formWishNew, errorWishNew, submitWishNew, handleFileUpload,
            logs, filter, filteredLogs, exportLogsToExcel, exportWishesOldToExcel, exportWishesNewToExcel,
            QuotaSection, MobileNav, FeedbackSection, obsoleteNote, ShelfBulletin, OffShelfBulletin, NotesBoard, openNote,
            WishOldList, WishNewList, WishBulletin
        };
    },
    render: __appRender
}).mount('#app');

/* ───────── 左下角：同步狀態與管理模式 ───────── */

createApp({
    setup() {
        const open = ref(false);
        const unlock = reactive({ name: admin.name, password: '', error: '', busy: false });
        const tab = ref('上架');
        const counting = reactive({ id: null, value: '', reason: '', error: '' });
        const form = ref(null); // 新增或編輯中的周邊；null 時顯示清單
        const formError = ref('');
        const formImagePreview = ref('');
        let formImageFile = null;

        const itemsInTab = computed(() => allItems.value.filter(item => item.category === tab.value));
        const countOf = category => allItems.value.filter(item => item.category === category).length;

        const retry = () => { sync.status = 'loading'; refresh(); };

        const setPreview = url => {
            if (formImagePreview.value.startsWith('blob:')) URL.revokeObjectURL(formImagePreview.value);
            formImagePreview.value = url;
        };

        const closeForm = () => { setPreview(''); form.value = null; };

        const closePanel = () => { closeForm(); counting.id = null; open.value = false; };

        const doUnlock = async () => {
            unlock.error = '';
            if (!unlock.name.trim() || !unlock.password) { unlock.error = '請填寫名字和密碼'; return; }
            unlock.busy = true;
            try {
                // 密碼確認正確後才切換到管理畫面
                const body = { action: 'verifyAdmin', data: {}, adminPassword: unlock.password };
                const payload = await callApi('runAction', JSON.stringify(body));
                applyState(payload.state);
                admin.password = unlock.password;
                admin.name = unlock.name.trim();
                writeSession('adminPassword', admin.password);
                writeSession('adminName', admin.name);
                unlock.password = '';
            } catch (e) {
                unlock.error = e.message;
            } finally {
                unlock.busy = false;
            }
        };

        const logout = () => { closeForm(); counting.id = null; lockAdmin(); };

        const startCount = item => {
            Object.assign(counting, { id: item.id, value: String(item.stock), reason: '', error: '' });
        };

        const submitCount = async item => {
            if (sync.saving) return;
            counting.error = '';
            const n = Number(counting.value);
            if (counting.value === '' || !Number.isInteger(n) || n < 0) { counting.error = '請輸入 0 或正整數'; return; }
            try {
                await save('adjustStock', { itemId: item.id, newStock: n, reason: counting.reason, person: admin.name }, { asAdmin: true });
                counting.id = null;
            } catch (e) {
                counting.error = e.message;
            }
        };

        const startEdit = item => {
            counting.id = null;
            formError.value = '';
            formImageFile = null;
            form.value = item
                ? { id: item.id, name: item.name, category: item.category, cost: String(item.cost), location: item.location, stock: item.stock, soldOut: item.soldOut || '絕版' }
                : { id: '', name: '', category: tab.value, cost: '', location: '', stock: '0', soldOut: '絕版' };
            setPreview(item ? item.image : '');
        };

        const pickImage = e => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            formImageFile = file;
            setPreview(URL.createObjectURL(file));
        };

        const submitForm = async () => {
            if (sync.saving) return;
            const f = form.value;
            formError.value = '';
            if (!f.name.trim()) { formError.value = '請填寫周邊名稱'; return; }
            if (!f.id && (!Number.isInteger(Number(f.stock)) || Number(f.stock) < 0 || f.stock === '')) {
                formError.value = '初始庫存請輸入 0 或正整數'; return;
            }
            try {
                const imageUpload = formImageFile ? await readImageForUpload(formImageFile) : null;
                await save('saveItem', {
                    id: f.id, name: f.name.trim(), category: f.category, cost: f.cost, location: f.location,
                    soldOut: f.soldOut, stock: Number(f.stock), person: admin.name, imageUpload
                }, { asAdmin: true });
                tab.value = f.category;
                closeForm();
            } catch (e) {
                formError.value = e.message;
            }
        };

        const statusText = () => {
            if (sync.saving) return '💾 儲存中…';
            if (sync.status === 'loading') return '⏳ 載入中…';
            if (sync.status === 'error') return '⚠️ 連線失敗';
            return `✓ 已同步 ${sync.lastSync}`;
        };

        const statusDock = () => h('div', { class: 'fixed bottom-8 left-8 z-40 flex flex-col items-start gap-2' }, [
            h('div', { class: 'bg-white border-2 border-ink rounded-xl px-3 py-1 text-sm font-bold shadow-cute-sm', title: sync.error }, statusText()),
            sync.status === 'error' && allItems.value.length
                ? h('button', { class: btnCls + ' bg-yellow text-sm', onClick: retry }, '重新連線')
                : null,
            h('button', {
                class: 'bg-yellow border-3 border-ink rounded-2xl px-4 py-2 font-bold shadow-cute btn-cute',
                onClick: () => { open.value = true; }
            }, '🔧 管理')
        ]);

        // 第一次載入時蓋住空白的畫面
        const loadingCover = () => {
            if (allItems.value.length || sync.status === 'ready') return null;
            const isError = sync.status === 'error';
            if (!isError) {
                return h('div', { class: 'fixed inset-0 z-30 flex items-center justify-center p-4 bg-paper' }, [loadingBadge()]);
            }
            return h('div', { class: 'fixed inset-0 z-30 flex items-center justify-center p-4 bg-paper/90' }, [
                h('div', { class: 'bg-white border-3 border-ink rounded-3xl p-8 shadow-cute max-w-md w-full text-center' }, [
                    h('div', { class: 'text-5xl mb-4' }, '⚠️'),
                    h('p', { class: 'font-bold text-lg mb-4' }, sync.error),
                    h('button', { class: btnCls + ' bg-yellow px-6 py-2', onClick: retry }, '重新連線')
                ])
            ]);
        };

        const unlockView = () => h('div', { class: 'space-y-4 max-w-sm' }, [
            sync.adminConfigured ? null : h('div', { class: errorCls }, '還沒設定管理者密碼：請到試算表上方選單「倉儲系統 → ② 設定管理者密碼」。'),
            h('p', { class: 'font-bold text-gray-600' }, '解鎖後可以補貨、盤點、新增和編輯周邊。關掉這個分頁就會自動登出。'),
            field('你的名字（會記在盤點、新增紀錄上） *', h('input', {
                class: inputCls, value: unlock.name, onInput: e => { unlock.name = e.target.value; }
            })),
            field('管理者密碼 *', h('input', {
                class: inputCls, type: 'password', value: unlock.password,
                onInput: e => { unlock.password = e.target.value; },
                onKeydown: e => { if (e.key === 'Enter') doUnlock(); }
            })),
            unlock.error ? h('div', { class: errorCls }, unlock.error) : null,
            h('button', {
                class: 'w-full bg-ink text-white border-2 border-ink rounded-xl py-3 font-bold btn-cute',
                disabled: unlock.busy, onClick: doUnlock
            }, unlock.busy ? '確認中…' : '解鎖管理模式')
        ]);

        const countForm = item => h('div', { class: 'mt-3 pt-3 border-t-2 border-dashed border-ink/30 flex flex-wrap items-end gap-2' }, [
            h('div', { class: 'font-bold text-sm pb-2' }, `目前 ${item.stock} 個 →`),
            h('label', { class: 'block' }, [
                h('span', { class: 'block text-xs font-bold mb-1' }, '實際數量'),
                h('input', {
                    type: 'number', min: 0, class: 'w-24 border-2 border-ink rounded-xl p-2 bg-white text-center font-bold',
                    value: counting.value, onInput: e => { counting.value = e.target.value; }
                })
            ]),
            h('label', { class: 'block flex-1 min-w-[160px]' }, [
                h('span', { class: 'block text-xs font-bold mb-1' }, '原因（選填）'),
                h('input', {
                    class: inputCls, placeholder: '例如：月底盤點',
                    value: counting.reason, onInput: e => { counting.reason = e.target.value; }
                })
            ]),
            h('button', { class: btnCls + ' bg-ink text-white py-2', onClick: () => submitCount(item) }, sync.saving ? '儲存中…' : '確認'),
            h('button', { class: btnCls + ' bg-white py-2', onClick: () => { counting.id = null; } }, '取消'),
            counting.error ? h('div', { class: errorCls + ' w-full' }, counting.error) : null
        ]);

        const itemRow = item => h('div', { key: item.id, class: 'bg-white border-2 border-ink rounded-2xl p-3' }, [
            // 手機寬度放不下時，庫存和按鈕會換到下一行
            h('div', { class: 'flex flex-wrap items-center gap-3' }, [
                h('img', { src: item.image, alt: '', class: 'w-12 h-12 object-contain border border-ink rounded-lg bg-gray-50 flex-shrink-0' }),
                h('div', { class: 'flex-1 min-w-[8rem]' }, [
                    h('div', { class: 'font-bold truncate', title: item.name }, item.name),
                    h('div', { class: 'text-xs text-gray-500 font-bold truncate' },
                        `成本 ${item.cost === '' || item.cost === '-' ? '-' : '$' + item.cost}　位置 ${item.location || '未設定'}` +
                        (item.category === '上架' || item.category === '加贈' ? `　售完→${item.soldOut === '下架' ? '已下架' : '絕版品'}` : ''))
                ]),
                h('div', { class: 'flex items-center gap-2 ml-auto' }, [
                    h('div', { class: ['text-lg font-black min-w-[3.5rem] text-right', item.stock <= 10 ? 'text-red-500' : ''] }, item.stock),
                    h('button', { class: btnCls + ' bg-blue text-sm', onClick: () => startCount(item) }, '盤點'),
                    h('button', { class: btnCls + ' bg-white text-sm', onClick: () => startEdit(item) }, '編輯')
                ])
            ]),
            counting.id === item.id ? countForm(item) : null
        ]);

        const listView = () => h('div', { class: 'flex flex-col min-h-0 flex-1' }, [
            h('div', { class: 'flex flex-wrap items-center gap-2 mb-3' }, [
                ...CATEGORIES.map(c => h('button', {
                    class: [btnCls, tab.value === c ? 'bg-yellow shadow-cute-sm' : 'bg-white'],
                    onClick: () => { tab.value = c; counting.id = null; }
                }, `${c} (${countOf(c)})`)),
                h('div', { class: 'flex-1' }),
                h('button', { class: btnCls + ' bg-green', onClick: () => startEdit(null) }, '＋ 新增周邊'),
                h('button', { class: btnCls + ' bg-white', onClick: logout }, '登出管理')
            ]),
            h('p', { class: 'text-sm font-bold text-gray-600 mb-3' },
                `登記人：${admin.name}｜庫存請用「盤點」修改，才會留下紀錄。名稱、成本、位置也可以直接在試算表改。`),
            tab.value === '配額'
                ? h('p', { class: 'text-sm font-bold text-blue-700 bg-blue/20 border border-blue rounded-xl p-2 mb-3' },
                    '配額名單（負責縣市、夥伴、預計數量）請在試算表的「配額」工作表修改。')
                : null,
            h('div', { class: 'overflow-y-auto flex-1 space-y-2 pr-1' },
                itemsInTab.value.length
                    ? itemsInTab.value.map(itemRow)
                    : [h('div', { class: 'text-center text-gray-500 font-bold py-8' }, '這個分類還沒有周邊')])
        ]);

        const formView = () => {
            const f = form.value;
            const bind = key => ({ value: f[key], onInput: e => { f[key] = e.target.value; } });
            return h('div', { class: 'overflow-y-auto flex-1 pr-1' }, [
                h('h4', { class: 'text-xl font-bold mb-4' }, f.id ? '編輯周邊' : '新增周邊'),
                h('div', { class: 'grid grid-cols-1 sm:grid-cols-2 gap-4' }, [
                    field('周邊名稱 *', h('input', { class: inputCls, ...bind('name') })),
                    field('分類 *', h('select', {
                        class: inputCls, value: f.category, onChange: e => { f.category = e.target.value; }
                    }, CATEGORIES.map(c => h('option', { value: c }, c)))),
                    field('成本', h('input', { class: inputCls, placeholder: '例如 50；沒有可填 -', ...bind('cost') })),
                    field('位置（門牌）', h('input', { class: inputCls, placeholder: '例如 A-1', ...bind('location') })),
                    f.category === '上架' || f.category === '加贈'
                        ? field('數量變 0 時', h('select', {
                            class: inputCls, value: f.soldOut, onChange: e => { f.soldOut = e.target.value; }
                        }, [
                            h('option', { value: '下架' }, '移到「已下架周邊」（夥伴可以許願）'),
                            h('option', { value: '絕版' }, '移到「絕版品」')
                        ]))
                        : null,
                    f.id
                        ? h('div', { class: 'text-sm font-bold text-gray-600 self-end pb-2' }, `目前庫存 ${f.stock} 個（要改數量請用「盤點」）`)
                        : field('初始庫存 *', h('input', { class: inputCls, type: 'number', min: 0, ...bind('stock') }))
                ]),
                h('div', { class: 'mt-4' }, [
                    h('span', { class: 'block font-bold mb-1 text-sm' }, '圖片'),
                    h('div', { class: 'flex items-center gap-3' }, [
                        h('div', { class: 'w-24 h-24 border-2 border-ink rounded-xl bg-white overflow-hidden flex items-center justify-center flex-shrink-0' }, [
                            formImagePreview.value
                                ? h('img', { src: formImagePreview.value, alt: '', class: 'w-full h-full object-contain' })
                                : h('span', { class: 'text-xs text-gray-400 font-bold' }, '沒有圖片')
                        ]),
                        h('label', { class: 'cursor-pointer bg-white border-2 border-ink rounded-xl px-4 py-2 font-bold hover:bg-gray-100' }, [
                            formImagePreview.value ? '更換圖片' : '選擇圖片',
                            h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', class: 'hidden', onChange: pickImage })
                        ])
                    ])
                ]),
                formError.value ? h('div', { class: errorCls + ' mt-4' }, formError.value) : null,
                h('div', { class: 'flex gap-3 mt-6' }, [
                    h('button', { class: 'flex-1 bg-ink text-white border-2 border-ink rounded-xl py-3 font-bold btn-cute', onClick: submitForm },
                        sync.saving ? '儲存中…' : '儲存'),
                    h('button', { class: 'bg-white border-2 border-ink rounded-xl px-6 py-3 font-bold btn-cute', onClick: closeForm }, '取消')
                ])
            ]);
        };

        const panel = () => h('div', { class: 'fixed inset-0 z-[60] flex items-center justify-center p-4 modal-backdrop' }, [
            h('div', { class: 'bg-paper border-3 border-ink rounded-3xl p-6 shadow-cute w-full max-w-4xl relative max-h-[90vh] flex flex-col' }, [
                h('button', { class: closeBtnCls, onClick: closePanel }, 'X'),
                h('h3', { class: 'text-2xl font-bold mb-4 bg-yellow inline-block self-start px-3 py-1 border-2 border-ink rounded-xl' }, '🔧 管理模式'),
                !admin.password ? unlockView() : form.value ? formView() : listView()
            ])
        ]);

        return () => [statusDock(), loadingCover(), open.value ? panel() : null];
    }
}).mount('#admin');

createApp({
    setup() {
        return () => (busy.count > 0 || gate.busy)
            ? h('div', { class: 'loading-overlay fixed inset-0 z-[110] flex items-center justify-center p-4 bg-paper/60' }, [loadingBadge()])
            : null;
    }
}).mount('#busy');
</script>
